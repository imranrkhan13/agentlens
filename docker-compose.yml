services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentlens
      POSTGRES_USER: agentlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentlens -d agentlens"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - agentlens-postgres:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${AGENTLENS_POSTGRES_PORT:-5432}:5432"

  api:
    build:
      context: ./backend
    environment:
      AGENTLENS_DATABASE_URL: postgresql+psycopg://agentlens:${POSTGRES_PASSWORD}@postgres:5432/agentlens
      AGENTLENS_API_KEY_PEPPER: ${AGENTLENS_API_KEY_PEPPER:?Copy .env.example to .env and set AGENTLENS_API_KEY_PEPPER}
      AGENTLENS_INTERNAL_API_TOKEN: ${AGENTLENS_INTERNAL_API_TOKEN:?Copy .env.example to .env and set AGENTLENS_INTERNAL_API_TOKEN}
      AGENTLENS_ENV: ${AGENTLENS_ENV:-development}
      AGENTLENS_CORS_ORIGINS: ${AGENTLENS_CORS_ORIGINS:-}
      AGENTLENS_CORS_ALLOW_CREDENTIALS: ${AGENTLENS_CORS_ALLOW_CREDENTIALS:-false}
      AGENTLENS_RATE_LIMIT_CAPACITY: ${AGENTLENS_RATE_LIMIT_CAPACITY:-120}
      AGENTLENS_RATE_LIMIT_REFILL_PER_SECOND: ${AGENTLENS_RATE_LIMIT_REFILL_PER_SECOND:-2}
      AGENTLENS_DB_POOL_SIZE: ${AGENTLENS_DB_POOL_SIZE:-10}
      AGENTLENS_DB_MAX_OVERFLOW: ${AGENTLENS_DB_MAX_OVERFLOW:-20}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${AGENTLENS_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  dashboard:
    build:
      context: ./frontend
    environment:
      DATABASE_URL: postgresql://agentlens:${POSTGRES_PASSWORD}@postgres:5432/agentlens
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Copy .env.example to .env and set BETTER_AUTH_SECRET}
      AGENTLENS_API_URL: http://api:8001
      AGENTLENS_INTERNAL_API_TOKEN: ${AGENTLENS_INTERNAL_API_TOKEN:?Copy .env.example to .env and set AGENTLENS_INTERNAL_API_TOKEN}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    depends_on:
      api:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    depends_on:
      - dashboard
    ports:
      - "${AGENTLENS_WEB_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  agentlens-postgres:
